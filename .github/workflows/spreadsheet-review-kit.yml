name: Spreadsheet review kit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review-kit:
    if: github.head_ref == 'feat/spreadsheet-production-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated spreadsheet test dependencies
        run: |
          mkdir -p /tmp/spreadsheet-kit
          echo '{"private":true}' > /tmp/spreadsheet-kit/package.json
          pnpm --dir /tmp/spreadsheet-kit add --ignore-scripts exceljs@4.4.0 jszip@3.10.1 vitest@4.1.5 typescript@5.9.3 tsx@4.22.4 react@18.3.1 react-dom@18.3.1 @types/react@18.3.12 @types/react-dom@18.3.1 @types/node@22.19.17 @fortune-sheet/react@1.0.4 @fortune-sheet/core@1.0.4 @testing-library/react@16.3.2 @testing-library/dom@10.4.0 jsdom@29.1.1
      - name: Package dependency kit
        run: tar -czf spreadsheet-test-deps.tar.gz -C /tmp/spreadsheet-kit node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-test-deps
          path: spreadsheet-test-deps.tar.gz
          retention-days: 1
